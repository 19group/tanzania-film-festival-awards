<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section Update</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .slide1-text {
            position: relative;
            min-height: 600px;
            display: flex;
            align-items: center;
        }
        
        .middle-text {
            width: 100%;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: center;
        }
        
        .content-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .cap-title h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0;
            line-height: 1.2;
            color: #333;
        }
        
        .date-address {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }
        
        .event-date, .event-location {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: #666;
        }
        
        .event-date i, .event-location i {
            font-size: 1.3rem;
            color: #ff6b35;
        }
        
        .secondary-btn {
            align-self: flex-start;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #ff6b35;
            color: #ff6b35;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .btn-outline:hover {
            background: #ff6b35;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }
        
        /* Prominent Submit Button on the Right */
        .submit-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .submit-btn-prominent {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            padding: 25px 45px;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            box-shadow: 0 15px 35px rgba(255, 107, 53, 0.4);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
        }
        
        .submit-btn-prominent::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .submit-btn-prominent:hover::before {
            left: 100%;
        }
        
        .submit-btn-prominent:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 107, 53, 0.6);
            background: linear-gradient(135deg, #f7931e 0%, #ff6b35 100%);
        }
        
        .submit-btn-prominent:active {
            transform: translateY(-2px) scale(1.02);
        }
        
        /* Pulsing animation */
        @keyframes pulse {
            0% {
                box-shadow: 0 15px 35px rgba(255, 107, 53, 0.4);
            }
            50% {
                box-shadow: 0 15px 35px rgba(255, 107, 53, 0.6), 0 0 0 10px rgba(255, 107, 53, 0.1);
            }
            100% {
                box-shadow: 0 15px 35px rgba(255, 107, 53, 0.4);
            }
        }
        
        /* Add a subtle arrow icon */
        .submit-btn-prominent::after {
            content: '→';
            margin-left: 10px;
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }
        
        .submit-btn-prominent:hover::after {
            transform: translateX(5px);
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .middle-text {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }
            
            .cap-title h1 {
                font-size: 2.5rem;
            }
            
            .submit-btn-prominent {
                padding: 20px 35px;
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 480px) {
            .cap-title h1 {
                font-size: 2rem;
            }
            
            .submit-btn-prominent {
                padding: 18px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div id="htmlcaption1" class="nivo-html-caption slider-caption-1">
        <div class="container">
            <div class="slide1-text">
                <div class="middle-text slide-def">
                    <div class="content-left">
                        <div class="cap-title wow fadeInDown" data-wow-duration=".9s" data-wow-delay="0.8s">
                            <h1 data-i18n="hero.title1">Tanzania Film</h1>
                        </div>
                        <div class="cap-title wow fadeInDown" data-wow-duration=".9s" data-wow-delay="0.8s">
                            <h1 data-i18n="hero.title2">Festival & Awards</h1>
                        </div>
                        <div class="cap-title wow fadeInDown" data-wow-duration=".9s" data-wow-delay="0.8s">
                            <h1 data-i18n="hero.title3">2025</h1>
                        </div>
                        
                        <div class="date-address">
                            <div class="event-date">
                                <i class="zmdi zmdi-calendar-note"></i>
                                <span data-i18n="hero.date">March 15-20, 2025</span>
                            </div>
                            <div class="event-location">
                                <i class="zmdi zmdi-pin"></i>
                                <span data-i18n="hero.location">Dar es Salaam, Tanzania</span>
                            </div>
                        </div>
                        
                        <div class="secondary-btn">
                            <a class="btn-outline" href="./program/" data-i18n="hero.program">See Program</a>
                        </div>
                    </div>
                    
                    <!-- Prominent Submit Button on the Right -->
                    <div class="submit-button-container">
                        <a class="submit-btn-prominent" href="https://filmfreeway.com/festivals/89505?utm_campaign=4th+Tanzania+Film+Festival+and+Awards+%28TAFFA%29&utm_medium=External&utm_source=Submission+Button" data-i18n="hero.submit">Submit Your Film</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
